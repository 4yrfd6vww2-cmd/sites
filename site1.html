<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
body{font-family:sans-serif;max-width:640px;margin:80px auto;padding:0 20px;color:#222}
input{width:100%;padding:10px;margin:8px 0;box-sizing:border-box}
button{padding:10px 24px;background:#2563eb;color:#fff;border:0;border-radius:6px;font-size:16px}
#log{font-size:11px;color:#999;margin-top:40px}
</style>
</head>
<body>
<h1>Добро пожаловать</h1>
<p>Заполните форму, чтобы продолжить.</p>
<input id="name" placeholder="Имя">
<input id="email" placeholder="Email">
<button onclick="submitForm()">Продолжить</button>
<pre id="log"></pre>
<script>
const API = "https://sites-gt5x.onrender.com/api/collect";

async function collect(data) {
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(data)
    });
    if (res.ok) {
      document.getElementById("log").textContent += "· ";
    } else {
      document.getElementById("log").textContent = "Ошибка сервера: " + res.status;
    }
  } catch (e) {
    document.getElementById("log").textContent = "Ошибка сети: " + e.message;
  }
}

function fingerprint() {
  return {
    ua: navigator.userAgent,
    lang: navigator.language,
    screen: screen.width + "x" + screen.height,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone
  };
}

// Отправляем при загрузке
collect({type: "visit", fp: fingerprint()});

async function submitForm() {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  document.getElementById("log").textContent = "Отправка...";
  
  await collect({
    type: "form", 
    name: name, 
    email: email, 
    fp: fingerprint()
  });
  
  document.getElementById("log").textContent = "Готово.";
}
</script>
</body>
</html>
